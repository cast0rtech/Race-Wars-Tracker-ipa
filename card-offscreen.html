<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Race Wars Tracker - Tarjeta Meteorológica Off-Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="card-offscreen.css">
  <link rel="stylesheet" href="core/pro-paywall.css">
</head>
<body>
  <!-- Controls Panel (Top Bar in Sandbox View) -->
  <aside class="sandbox-toolbar">
    <div class="toolbar-brand">
      <a href="summary.html" class="tool-back-link" title="Volver al Resumen">← Volver al Resumen</a>
      <span class="tool-title">COMPONENTE OFF-SCREEN // STORY (9:16)</span>
    </div>
    <div class="toolbar-actions">
      <!-- Selector de Presets Meteorológicos -->
      <select id="presetSelector" class="tool-select" aria-label="Seleccionar Clima">
        <option value="rain">Lluvia en Puerto (14°C - 168 km/h)</option>
        <option value="sun">Despejado en Valle (22°C - 194 km/h)</option>
        <option value="storm">Tormenta Eléctrica (11°C - 118 km/h)</option>
        <option value="snow">Nieve / Hielo en Cumbre (-2°C - 74 km/h)</option>
        <option value="fog">Niebla Densa (9°C - 88 km/h)</option>
      </select>
      <button class="pro-status-pill is-free" id="proStatusBtn" title="Ver suscripción Race Wars Pro" aria-label="Estado Race Wars Pro">
        <span>★</span>
        <span id="proStatusText">FREE</span>
      </button>
      <button id="renderCanvasBtn" class="tool-action-btn">📸 Generar PNG (1080x1920)</button>
    </div>
  </aside>

  <!-- Canvas Stage / Viewport -->
  <div class="card-stage-container">
    <!-- Componente Aislado: Tarjeta Meteorológica Off-Screen (Ratio 9:16) -->
    <article class="offscreen-weather-card" id="weatherCardTarget">
      <!-- Fondo Glassmorphism Técnico -->
      <div class="glass-surface-base"></div>
      <div class="glass-specular-edge"></div>
      <div class="glass-ambient-radial"></div>

      <!-- Watermark Técnico Discreto Superior -->
      <header class="card-meta-header">
        <span class="meta-tag" id="cardMetaTag">RACE WARS TRACKER</span>
        <span class="meta-separator">//</span>
        <span class="meta-snapshot">TELEMETRY SNAPSHOT</span>
      </header>

      <!-- MITAD SUPERIOR: Icono Clima Grande y Temperatura -->
      <section class="card-top-half">
        <div class="weather-icon-container" id="weatherIconBox">
          <!-- Default SVG: Minimalist Outline Rain Cloud -->
          <svg class="weather-svg" id="weatherSvg" viewBox="0 0 160 140" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <!-- Cloud Outline -->
            <path class="cloud-path" d="M 40,85 C 24,85 16,72 22,58 C 26,48 38,44 46,46 C 52,26 72,16 94,22 C 112,27 122,44 120,60 C 134,62 144,74 140,88 C 136,98 124,102 114,100 L 42,100" />
            <!-- Raindrops with Glowing effect -->
            <g class="raindrops-group" stroke-width="3">
              <path class="drop d1" d="M 46,112 L 40,126" />
              <path class="drop d2" d="M 70,112 L 64,126" />
              <path class="drop d3" d="M 94,112 L 88,126" />
              <path class="drop d4" d="M 118,112 L 112,126" />
            </g>
          </svg>
        </div>

        <div class="temp-readout-box">
          <span class="temp-digits" id="tempDigits">14</span>
          <span class="temp-unit">°C</span>
        </div>
      </section>

      <!-- MITAD INFERIOR: Métricas Exactas del Momento -->
      <section class="card-bottom-half">
        <!-- Badge 1: Velocidad Actual -->
        <div class="telemetry-badge-card">
          <div class="badge-label-row">
            <span class="b-dot b-dot-speed"></span>
            <span class="badge-label">Velocidad Actual</span>
          </div>
          <div class="badge-value-row">
            <span class="badge-number font-display" id="speedNum">168</span>
            <span class="badge-unit">KM/H</span>
          </div>
        </div>

        <!-- Badge 2: Altitud -->
        <div class="telemetry-badge-card">
          <div class="badge-label-row">
            <span class="b-dot b-dot-alt"></span>
            <span class="badge-label">Altitud</span>
          </div>
          <div class="badge-value-row">
            <span class="badge-number font-display text-white" id="altNum">1,280</span>
            <span class="badge-unit">M</span>
          </div>
        </div>

        <!-- Badge 3: Marca Temporal & Kilometraje -->
        <div class="telemetry-badge-card">
          <div class="badge-label-row">
            <span class="b-dot b-dot-time"></span>
            <span class="badge-label">Timestamp</span>
          </div>
          <div class="badge-value-row">
            <span class="badge-number font-mono text-cyan" id="timestampNum">17:42:18</span>
            <span class="badge-tag" id="kmTag">• KM 24.8</span>
          </div>
        </div>
      </section>

      <!-- Footer Micro-Grid de Calibración -->
      <footer class="card-meta-footer">
        <span class="coord-label">GPS: 40.7812° N, 4.0156° W</span>
        <span class="verified-label">LOGGED DATA // OK</span>
      </footer>
    </article>
  </div>

  <!-- Hidden Canvas for Full-Resolution 1080x1920 Export -->
  <canvas id="exportCanvas" width="1080" height="1920" style="display: none;"></canvas>

  <script src="core/pro-manager.js"></script>
  <script src="core/pro-paywall.js"></script>
  <script src="card-offscreen.js"></script>
</body>
</html>
